name: Build and deploy EpicBook

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image names
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE=ghcr.io/$owner/epicbook-backend:$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/$owner/epicbook-frontend:$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}

      - name: Configure SSH with pinned host key
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy

      - name: Deploy to VM
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_deploy "$VM_USER@$VM_HOST" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh -i ~/.ssh/id_deploy "$VM_USER@$VM_HOST" "
            set -e
            cd ~/theepicbook
            git fetch origin
            git checkout --force $GITHUB_SHA
            export BACKEND_IMAGE=$BACKEND_IMAGE FRONTEND_IMAGE=$FRONTEND_IMAGE
            docker compose pull backend frontend
            docker compose up -d --no-build --wait
            docker logout ghcr.io
          "

      - name: Verify public health endpoint
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors --max-time 10 "http://$VM_HOST/health"
