# Field list is deliberately short: no query strings, cookies or Authorization headers.
log_format epicbook_json escape=json
  '{"time":"$time_iso8601","client":"$remote_addr","method":"$request_method",'
  '"path":"$uri","status":$status,"bytes":$body_bytes_sent,'
  '"request_time":$request_time,"upstream":"$upstream_addr",'
  '"upstream_status":"$upstream_status","upstream_time":"$upstream_response_time"}';

# Keep the container's own health probe out of the access log.
map $remote_addr $log_request {
  127.0.0.1 0;
  default   1;
}

server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 1m;

  access_log /var/log/nginx/access.log epicbook_json if=$log_request;
  error_log  /var/log/nginx/error.log warn;

  # Docker's DNS, re-resolved at request time so a recreated container's new IP is picked up.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $frontend_upstream http://frontend:8080;
  set $backend_upstream  http://backend:8080;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 5s;
  proxy_read_timeout 30s;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;

  # Static files
  location /assets/ {
    proxy_pass $frontend_upstream;
  }

  # Health endpoint
  location = /health {
    proxy_pass $backend_upstream;
  }

  # API requests
  location /api/ {
    proxy_pass $backend_upstream;
  }

  # Application pages (/, /cart, /gallery, /category/...)
  location / {
    proxy_pass $backend_upstream;
  }
}
